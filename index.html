<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeitreise in die Steinzeit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  --paper:#fffdf7; --paper-2:#f3ecdd; --ink:#2b2118; --ink-soft:#6b5a48; --line:#b9ab95;
  --ochre:#e4a428; --ochre-2:#b47d12; --charcoal:#2b2118; --moss:#4e7a3a;
  --hud:rgba(255,253,247,.93);
  --font-body:'Andika','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --font-head:'Fredoka','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#2a231c; --paper-2:#382e24; --ink:#f6eddd; --ink-soft:#cdbb9f; --line:#6c5a46; --hud:rgba(38,31,24,.92); }
}
:root[data-theme="dark"]{ --paper:#2a231c; --paper-2:#382e24; --ink:#f6eddd; --ink-soft:#cdbb9f; --line:#6c5a46; --hud:rgba(38,31,24,.92); }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#110c08;color:var(--ink);font-family:var(--font-body)}
button{font:inherit;color:inherit}

/* ---------- Die Welten ---------- */
.world{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#110c08;visibility:hidden;opacity:0}
.world.on{visibility:visible;opacity:1}
/* Überblendung: die alte Zeit verschwimmt und vergilbt, die neue schärft sich aus dem Nebel */
.world.go{transition:opacity 1.1s ease, filter 1.2s ease, transform 1.6s cubic-bezier(.2,.7,.2,1)}
.world.leaving{opacity:0;filter:blur(12px) sepia(.55) saturate(.6);transform:scale(1.07)}
.world.pre{visibility:visible;opacity:0;filter:blur(14px) sepia(.6) saturate(.5);transform:scale(1.09)}

/* ---------- Zeitreise-Bildschirm ---------- */
.reise{position:fixed;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;opacity:0;visibility:hidden;
  background:radial-gradient(circle at 50% 46%,rgba(70,48,26,.82),rgba(14,9,5,.96) 72%);transition:opacity .7s ease, visibility 0s linear .7s}
.reise.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .7s ease}
.streaks{position:absolute;inset:0;overflow:hidden}
.streaks i{position:absolute;left:0;height:2px;width:34vw;border-radius:2px;opacity:.0;
  background:linear-gradient(90deg,rgba(255,214,150,0),rgba(255,214,150,.75),rgba(255,214,150,0));animation:streak 1.1s linear infinite}
.reise.back .streaks i{animation-name:streakBack}
@keyframes streak{0%{transform:translateX(-40vw);opacity:0}15%{opacity:.85}100%{transform:translateX(110vw);opacity:0}}
@keyframes streakBack{0%{transform:translateX(110vw);opacity:0}15%{opacity:.85}100%{transform:translateX(-40vw);opacity:0}}
.reise-inner{position:relative;text-align:center;padding:24px;color:#f3e7d3}
.reise-kicker{font-family:var(--font-head);font-weight:600;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.reise-year{font-family:var(--font-head);font-weight:600;font-size:clamp(1.6rem,5vw,2.6rem);margin:.3em 0 .1em;font-variant-numeric:tabular-nums;color:#ffd38a}
.reise-title{font-family:var(--font-head);font-weight:700;font-size:clamp(2.6rem,10vw,5.2rem);letter-spacing:.05em;line-height:1;margin:.15em 0 .2em;
  color:#fffdf7;-webkit-text-stroke:5px var(--charcoal);paint-order:stroke fill;transform:scale(.92);opacity:0;transition:transform .9s cubic-bezier(.2,.8,.2,1) .25s, opacity .6s ease .25s}
.reise.show .reise-title{transform:none;opacity:1}
.reise-sub{font-family:var(--font-head);font-weight:500;font-size:clamp(1.05rem,3vw,1.35rem);opacity:.85}
.reise-load{margin-top:22px;min-height:44px;opacity:0;transition:opacity .4s}
.reise-load.on{opacity:1}
.load-bar{width:min(320px,70vw);height:8px;border-radius:5px;background:rgba(255,255,255,.15);margin:0 auto;overflow:hidden}
.load-bar i{display:block;height:100%;width:0;background:#e4a428;transition:width .3s}
.reise-msg{font-size:.98rem;margin-top:8px;opacity:.8}
.reise .btn{pointer-events:auto;margin-top:14px;font-family:var(--font-head);font-weight:600;font-size:1.05rem;border:2px solid var(--charcoal);border-radius:14px;
  padding:.62em 1.15em;background:var(--ochre);color:#2b2118;box-shadow:0 4px 0 var(--charcoal);cursor:pointer}

/* ---------- Zeitstrahl ---------- */
.zs{position:fixed;z-index:20;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);
  background:var(--hud);border:2px solid var(--charcoal);border-radius:12px;box-shadow:0 3px 0 var(--charcoal);padding:7px 10px 8px;
  transition:opacity .35s ease, transform .35s ease;font-family:var(--font-head)}
.zs.away{opacity:0;pointer-events:none;transform:translate(-50%,-10px)}
.zs-head{font-weight:600;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:center;margin-bottom:5px}
.zs-track{display:flex;align-items:center;gap:0}
.zs-era{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--line);border-radius:10px;background:var(--paper);padding:5px 10px;
  cursor:pointer;line-height:1.15;transition:background .3s, border-color .3s, box-shadow .3s}
.zs-era:hover{border-color:var(--ochre-2)}
.zs-era[aria-current="true"]{background:var(--ochre);border-color:var(--charcoal);box-shadow:0 3px 0 var(--charcoal);color:#2b2118}
.zs-era:focus-visible{outline:3px solid #3c7fd6;outline-offset:3px}
.zs-ico{font-size:1.5rem}
.zs-name{display:block;font-weight:600;font-size:1.02rem}
.zs-date{display:block;font-family:var(--font-body);font-size:.78rem;opacity:.8}
.zs-found{display:block;font-family:var(--font-body);font-size:.74rem;opacity:.75}
.zs-line{position:relative;width:110px;height:24px;margin:0 6px;flex:none}
.zs-line::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--charcoal) 0 10px,transparent 10px 15px)}
.zs-line::after{content:"Mittelsteinzeit";position:absolute;left:0;right:0;top:100%;margin-top:-4px;text-align:center;font-family:var(--font-body);font-size:.66rem;color:var(--ink-soft);white-space:nowrap}
.zs-runner{position:absolute;top:50%;left:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--ochre);border:2px solid var(--charcoal);
  box-shadow:0 0 0 3px rgba(228,164,40,.35);transition:left 1.8s cubic-bezier(.45,0,.2,1)}
.zs-runner.end{left:100%}
/* Mittlere Breiten: kompakt neben der Fortschrittsanzeige der Welt; auf der Startkarte kompakt über der Karte */
@media (max-width:1339px){
  .zs:not(.atstart){left:400px;transform:none}
  .zs:not(.atstart).away{transform:translateY(-10px)}
  .zs{padding:6px 8px}
  .zs-head,.zs-date,.zs-found{display:none}
  .zs-era{padding:4px 9px;gap:6px}
  .zs-ico{font-size:1.25rem}
  .zs-name{font-size:.95rem}
  .zs-line{width:64px}
  .zs-line::after{display:none}
}
/* Schmale Bildschirme: im Spiel senkrecht rechts unter der Karte der Welt */
@media (max-width:979px){
  .zs:not(.atstart){left:auto;right:12px;top:calc(env(safe-area-inset-top,0px) + 176px);padding:6px}
  .zs:not(.atstart) .zs-track{flex-direction:column;align-items:stretch}
  .zs-era{padding:4px 8px}
  .zs-ico{font-size:1.2rem}
  .zs-name{font-size:.9rem}
  .zs:not(.atstart) .zs-line{width:24px;height:30px;margin:2px auto}
  .zs:not(.atstart) .zs-line::before{left:50%;right:auto;top:0;bottom:0;width:4px;height:auto;margin:0 0 0 -2px;background:repeating-linear-gradient(180deg,var(--charcoal) 0 6px,transparent 6px 10px)}
  .zs:not(.atstart) .zs-runner{left:50%;top:0;transition:top 1.8s cubic-bezier(.45,0,.2,1)}
  .zs:not(.atstart) .zs-runner.end{left:50%;top:100%}
  .zs.atstart .zs-line{width:40px}
}
@media (max-width:640px){ .zs:not(.atstart){top:calc(env(safe-area-inset-top,0px) + 128px)} }
@media (prefers-reduced-motion: reduce){
  .world.go{transition:opacity .5s ease}
  .world.leaving,.world.pre{filter:none;transform:none}
  .streaks{display:none}
  .reise-title{transition:opacity .3s}
  .zs-runner{transition:none}
}
</style>
</head>
<body>
<div id="worlds"></div>

<div id="reise" class="reise" aria-hidden="true">
  <div class="streaks" id="streaks"></div>
  <div class="reise-inner">
    <div class="reise-kicker">Zeitreise</div>
    <div class="reise-year" id="reiseYear" aria-live="polite"></div>
    <div class="reise-title" id="reiseTitle"></div>
    <div class="reise-sub" id="reiseSub"></div>
    <div class="reise-load" id="reiseLoad"><div class="load-bar"><i id="reiseBar"></i></div><div class="reise-msg" id="reiseMsg"></div></div>
  </div>
</div>

<nav class="zs" id="zs" aria-label="Zeitstrahl">
  <div class="zs-head">⏳ Zeitstrahl</div>
  <div class="zs-track" id="zsTrack"></div>
</nav>

<script>
(function(){
'use strict';
/* Jede Epoche ist eine eigene, vollständig getrennte Seite. Diese Startseite zeigt sie an und blendet zwischen ihnen über. */
var ERAS = [
  { id:'altsteinzeit', file:'altsteinzeit.html', name:'Altsteinzeit', icon:'🦣', date:'bis ca. 10 000 v. Chr.', year:15000, sub:'Im Lager der Jäger und Sammler' },
  { id:'jungsteinzeit', file:'jungsteinzeit.html', name:'Jungsteinzeit', icon:'🌾', date:'ca. 5500 – 2200 v. Chr.', year:4000, sub:'Im Dorf der ersten Bauern' }
];
var BY = {}; ERAS.forEach(function(e, i){ e.index = i; BY[e.id] = e; });
var touch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || false;
var LOW = touch || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var $ = function(s){ return document.querySelector(s); };
var worlds = $('#worlds'), zs = $('#zs'), reise = $('#reise');
var frames = {}, state = {}, cur = null, busy = false;

/* ---------- Zeitstrahl aufbauen ---------- */
var track = $('#zsTrack');
ERAS.forEach(function(e, i){
  if (i > 0){ var line = document.createElement('div'); line.className = 'zs-line'; if (i === 1){ var run = document.createElement('i'); run.className = 'zs-runner'; run.id = 'zsRunner'; line.appendChild(run); } track.appendChild(line); }
  var b = document.createElement('button'); b.className = 'zs-era'; b.dataset.era = e.id; b.setAttribute('aria-current', 'false');
  b.innerHTML = '<span class="zs-ico" aria-hidden="true">' + e.icon + '</span><span><span class="zs-name">' + e.name + '</span><span class="zs-date">' + e.date + '</span><span class="zs-found" id="found-' + e.id + '"></span></span>';
  b.addEventListener('click', function(){ travel(e.id); });
  track.appendChild(b);
});
function markEra(id){
  [].forEach.call(document.querySelectorAll('.zs-era'), function(b){ b.setAttribute('aria-current', b.dataset.era === id ? 'true' : 'false'); });
  $('#zsRunner').classList.toggle('end', BY[id].index > 0);
}

/* ---------- Welten laden ---------- */
function makeFrame(id){
  var f = document.createElement('iframe'); f.className = 'world'; f.title = BY[id].name + ' – 3D-Welt'; f.src = BY[id].file;
  worlds.appendChild(f);
  frames[id] = f; state[id] = { ready:false, p:0, msg:'', modal:'start', error:false };
  return f;
}
function send(id, cmd){ var f = frames[id]; if (f && f.contentWindow) try { f.contentWindow.postMessage({ zeitCmd:cmd }, '*'); } catch(e){} }
function eraOf(src){ for (var id in frames) if (frames[id].contentWindow === src) return id; return null; }
window.addEventListener('message', function(ev){
  var d = ev.data; if (!d || !d.zeit || !d.type) return;
  var id = eraOf(ev.source); if (!id) return; var st = state[id];
  if (d.type === 'progress'){ st.p = d.p; st.msg = d.msg; if (busy) showLoad(id); }
  if (d.type === 'ready'){ st.ready = true; st.p = 1; setFound(id, d.found, d.total); if (id !== cur) send(id, 'pause'); }
  if (d.type === 'found') setFound(id, d.found, d.total);
  if (d.type === 'modal'){ st.modal = d.modal; if (id === cur) updateZs(); }
  if (d.type === 'error'){ st.error = true; if (busy) showLoad(id); }
});
function setFound(id, n, total){ var el = document.getElementById('found-' + id); if (el && total) el.textContent = n + ' / ' + total + ' entdeckt'; }
/* Während eine Infokarte, das Quiz oder das Forscherheft offen ist, tritt der Zeitstrahl zurück */
function updateZs(){ var m = cur && state[cur].modal; zs.classList.toggle('away', busy || (!!m && m !== 'start')); zs.classList.toggle('atstart', m === 'start'); }

/* ---------- Zeitreise-Bildschirm ---------- */
(function(){ var s = $('#streaks'); for (var i=0;i<22;i++){ var e = document.createElement('i'); e.style.top = (4 + Math.random()*92) + '%'; e.style.width = (18 + Math.random()*30) + 'vw'; e.style.animationDelay = (-Math.random()*1.1) + 's'; e.style.animationDuration = (0.7 + Math.random()*0.8) + 's'; s.appendChild(e); } })();
function fmtYear(y){ return Math.round(y).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' v. Chr.'; }
var yearRaf = 0;
function runYear(from, to, ms){
  cancelAnimationFrame(yearRaf); var t0 = performance.now(), el = $('#reiseYear');
  (function step(now){ var k = Math.min(1, (now - t0)/ms), e = k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2; el.textContent = fmtYear(from + (to - from)*e); if (k < 1) yearRaf = requestAnimationFrame(step); })(t0);
}
function showLoad(id){
  var st = state[id], box = $('#reiseLoad');
  if (st.error){ box.classList.add('on'); $('#reiseBar').style.width = '0%'; $('#reiseMsg').innerHTML = 'Diese Zeit konnte nicht geladen werden. Bitte prüfe die Internetverbindung.<br><button class="btn" id="reiseBack">Zurück</button>';
    var b = $('#reiseBack'); if (b) b.onclick = function(){ location.reload(); }; return; }
  if (st.ready){ box.classList.remove('on'); return; }
  box.classList.add('on'); $('#reiseBar').style.width = Math.round(st.p*100) + '%'; $('#reiseMsg').textContent = st.msg || 'Die Welt wird aufgebaut …';
}
var wait = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
function untilReady(id){ return new Promise(function(r){ (function chk(){ if (state[id].ready) r(); else setTimeout(chk, 120); })(); }); }

/* ---------- Umschalten zwischen den Zeiten ---------- */
function travel(to){
  if (busy || to === cur || !BY[to]) return;
  busy = true; updateZs();
  var from = cur, A = frames[from], B = frames[to] || makeFrame(to), fwd = BY[to].index > BY[from].index, t0 = performance.now();
  markEra(to);
  $('#reiseTitle').textContent = BY[to].name.toUpperCase(); $('#reiseSub').textContent = BY[to].sub;
  reise.classList.toggle('back', !fwd); reise.classList.add('show'); reise.setAttribute('aria-hidden', 'false');
  runYear(BY[from].year, BY[to].year, reduce ? 300 : 1900); showLoad(to);
  send(from, 'pause');
  A.classList.add('go'); A.classList.add('leaving');
  B.classList.remove('on', 'go', 'leaving'); B.classList.add('pre');
  return wait(reduce ? 450 : 1150).then(function(){
    A.classList.remove('on', 'leaving'); A.style.visibility = 'hidden';
    return untilReady(to);
  }).then(function(){
    $('#reiseLoad').classList.remove('on');
    return wait(Math.max(0, (reduce ? 600 : 2100) - (performance.now() - t0)));
  }).then(function(){
    send(to, 'resume');
    B.style.visibility = ''; B.classList.add('go'); void B.offsetWidth; B.classList.remove('pre'); B.classList.add('on');
    reise.classList.remove('show'); reise.setAttribute('aria-hidden', 'true');
    cur = to; try { history.replaceState(null, '', '#' + to); } catch(e){ location.hash = to; }
    try { B.focus(); } catch(e){}
    return wait(reduce ? 500 : 1500);
  }).then(function(){
    A.classList.remove('go'); B.classList.remove('go');
    // Auf Tablets und schwächeren Geräten wird die verlassene Welt entladen, damit der Speicher reicht
    if (LOW && frames[from]){ A.remove(); delete frames[from]; state[from] = { ready:false, p:0, msg:'', modal:'start', error:false }; }
    busy = false; updateZs();
  });
}

/* ---------- Start ---------- */
var first = (location.hash || '').replace('#', '');
cur = BY[first] ? first : ERAS[0].id;
var f0 = makeFrame(cur); f0.classList.add('on'); markEra(cur); updateZs();
f0.addEventListener('load', function(){ try { f0.focus(); } catch(e){} });
window.addEventListener('hashchange', function(){ var h = location.hash.replace('#', ''); if (BY[h] && h !== cur) travel(h); });
})();
</script>
</body>
</html>
